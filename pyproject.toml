[project]
name = "dnpr"
version = "0.1.0"
description = "DNPR: Zero-Shot Industrial Anomaly Detection via Dynamic Normal Prototype Evolution"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9,<3.11"
authors = [
    { name = "Shuyun Li", email = "tlm2640@163.com" }
]
keywords = [
    "anomaly-detection",
    "industrial-inspection",
    "zero-shot",
    "computer-vision",
    "deep-learning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "scikit-image>=0.21.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "PyYAML>=6.0",
    "easydict>=1.10",
    "tqdm>=4.65.0",
    "tabulate",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/shuyunli23/DNPR-main"
Documentation = "https://github.com/shuyunli23/DNPR-main#readme"
Repository = "https://github.com/shuyunli23/DNPR-main"
Issues = "https://github.com/shuyunli23/DNPR-main/issues"

[project.scripts]
dnpr-train = "dnpr.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dnpr"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | build
    | dist
    | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
